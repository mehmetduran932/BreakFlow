name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build packages
      run: pnpm build

    - name: Run unit tests
      run: pnpm test:unit

    - name: Pack workspace packages
      run: |
        mkdir -p dist-packages
        cd packages/core && pnpm pack --pack-destination ../../dist-packages && cd ../..
        cd packages/browser && pnpm pack --pack-destination ../../dist-packages && cd ../..
        cd packages/playwright && pnpm pack --pack-destination ../../dist-packages && cd ../..
        cd packages/cli && pnpm pack --pack-destination ../../dist-packages && cd ../..
        cd dist-packages
        tar -czvf ../breakflow-packages.tar.gz *.tgz
        cd ..

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: breakflow-packages
        path: |
          ./dist-packages/*.tgz
          ./breakflow-packages.tar.gz

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ./dist-packages/*.tgz
          ./breakflow-packages.tar.gz
        generate_release_notes: true

    - name: Publish to npm registry
      if: env.NPM_TOKEN != ''
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
        pnpm -r publish --access public --no-git-checks
