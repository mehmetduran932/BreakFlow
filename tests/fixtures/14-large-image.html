<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>14 - Large Standalone Image Test</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 0; }
    .spacer { height: 600px; background: #e2e8f0; padding: 20px; box-sizing: border-box; }
    .img-box {
      width: 100%;
      height: 500px;
      background: #38bdf8;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="content">
    <div class="spacer">
      <h1>Introductory Visual Section</h1>
      <p>Content filling 600px of the first page.</p>
    </div>

    <!-- 500px tall image box. Cannot fit on Page 1 (600 + 500 = 1100px > 1000px).
         BreakFlow must move the entire image box to Page 2! -->
    <div class="img-box" id="large-diagram" data-breakflow="keep">
      Full High-Resolution Architectural Blueprint
    </div>
  </div>
</body>
</html>
